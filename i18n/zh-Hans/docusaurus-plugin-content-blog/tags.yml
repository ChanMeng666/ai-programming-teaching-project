  permalink: /tutorial
  description: "本站博客的实用教程：腾讯会议录屏下载、Gemini CLI 安装与使用、零基础 AI 编程学习路线、教程视频资源汇总，以及 HER WAKA 项目介绍等指南。"

tencent-meeting:
  label: 腾讯会议
  permalink: /tencent-meeting
