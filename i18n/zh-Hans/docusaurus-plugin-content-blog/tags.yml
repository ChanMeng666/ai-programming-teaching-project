UI-UX:
  label: UI/UX
  permalink: /ui-ux
  description: "用户界面与用户体验设计相关文章，包括色彩对比、字体层级、网格布局、导航与卡片等组件设计，以及动画、响应式和无障碍设计方面的实践指南。"

documentation:
  label: 文档
  permalink: /documentation
  description: "技术文档与设计规范类文章，例如本站 AI 编程教育平台的设计系统文档：把色彩、字体、布局和组件规则写成可执行的规范，并说明如何在代码中落地。"

tutorial:
